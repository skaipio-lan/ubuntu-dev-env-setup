---
- name: Configure Ubuntu workstations
  hosts: workstations
  # Personal settings: user.yml if present, otherwise the empty example.
  vars_files:
    - [user.yml, user.example.yml]
  pre_tasks:
    - name: Verify the supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version in supported_ubuntu_versions
        fail_msg: >-
          Ubuntu {{ ansible_facts.distribution_version }} is not in
          supported_ubuntu_versions ({{ supported_ubuntu_versions | join(', ') }}).
      tags: [always]

  roles:
    - role: base
      when: install_base | default(false) | bool
      tags: [base]

    - role: shell
      when: install_shell | default(false) | bool
      tags: [shell]

    - role: git
      when: install_git | default(false) | bool
      tags: [git]

    - role: development
      when: install_development | default(false) | bool
      tags: [development]

    - role: docker
      when: install_docker | default(false) | bool
      tags: [docker]

    - role: applications
      when: install_applications | default(false) | bool
      tags: [applications]

    - role: ai_tools
      when: install_ai_tools | default(false) | bool
      tags: [ai_tools]
