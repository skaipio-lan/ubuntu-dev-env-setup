---
- name: Ensure development packages are installed
  become: true
  ansible.builtin.apt:
    name: "{{ development_packages }}"
    state: present
    install_recommends: false
    fail_on_autoremove: true
    update_cache: true
    cache_valid_time: 3600

- name: Set up Python with pyenv
  ansible.builtin.import_tasks: python.yml
  when: development_python | bool
  tags: [python]

- name: Set up Node.js with nvm
  ansible.builtin.import_tasks: node.yml
  when: development_node | bool
  tags: [node]

- name: Set up the GitHub CLI
  ansible.builtin.import_role:
    name: apt_repository
  vars:
    apt_repository_name: github-cli
    apt_repository_uri: "{{ development_github_cli_repo_url }}"
    apt_repository_suite: stable
    apt_repository_components: [main]
    apt_repository_key_url: "{{ development_github_cli_gpg_url }}"
    apt_repository_keyring: "{{ development_github_cli_keyring }}"
    apt_repository_fingerprints: "{{ development_github_cli_gpg_fingerprints }}"
    apt_repository_packages: [gh]
  when: development_github_cli | bool
  tags: [gh]

- name: Set up the Azure CLI
  ansible.builtin.import_role:
    name: apt_repository
  vars:
    apt_repository_name: azure-cli
    apt_repository_uri: "{{ development_azure_cli_repo_url }}"
    apt_repository_suite: "{{ ansible_facts.distribution_release }}"
    apt_repository_components: [main]
    apt_repository_key_url: "{{ development_azure_cli_gpg_url }}"
    apt_repository_keyring: "{{ development_azure_cli_keyring }}"
    apt_repository_fingerprints: "{{ development_azure_cli_gpg_fingerprints }}"
    apt_repository_packages: [azure-cli]
  when: development_azure_cli | bool
  tags: [az]
