---
# Development tools from the Ubuntu archive.
development_packages:
  - ansible-lint  # Lints this repository; pulls in yamllint.

# Per-tool switches. Each tool has its own tag as well.
development_python: true
development_node: true
development_github_cli: true
development_azure_cli: true

# Python through pyenv (https://github.com/pyenv/pyenv), checked out at a
# release tag. Bump the tag to get newer Python definitions.
development_pyenv_version: v2.8.15
development_pyenv_root: "{{ ansible_facts.user_dir }}/.pyenv"
# A version prefix: the newest matching release is installed when none is,
# and it becomes the global python. Newer patch releases are not installed
# automatically; run `pyenv install 3.15` to upgrade.
development_python_version: "3.15"
# Build dependencies from the pyenv wiki's suggested build environment.
development_python_build_packages:
  - build-essential
  - libbz2-dev
  - libffi-dev
  - libgdbm-dev
  - liblzma-dev
  - libncurses-dev
  - libreadline-dev
  - libsqlite3-dev
  - libssl-dev
  - libxml2-dev
  - libxmlsec1-dev
  - libzstd-dev
  - tk-dev
  - uuid-dev
  - xz-utils
  - zlib1g-dev

# Node.js through nvm (https://github.com/nvm-sh/nvm), checked out at a
# release tag.
development_nvm_version: v0.41.0
development_nvm_dir: "{{ ansible_facts.user_dir }}/.nvm"
# A major version or nvm alias. Installed when no matching version is, and
# set as nvm's default. Run `nvm install 26` to pick up newer releases.
development_node_version: "26"

# GitHub CLI (gh) from GitHub's official APT repository
# (https://github.com/cli/cli/blob/trunk/docs/install_linux.md). The keyring
# must contain every listed fingerprint; they are published at the top of
# that page. If GitHub rotates keys, delete the keyring, update the list,
# and rerun.
development_github_cli_repo_url: https://cli.github.com/packages
development_github_cli_gpg_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
development_github_cli_gpg_fingerprints:
  - 2C6106201985B60E6C7AC87323F3D4EA75716059
  - 7F38BBB59D064DBCB3D84D725612B36462313325
development_github_cli_keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg

# Azure CLI (az) from Microsoft's APT repository
# (https://learn.microsoft.com/cli/azure/install-azure-cli-linux), using the
# suite for the running Ubuntu release. Same keyring rules as above.
development_azure_cli_repo_url: https://packages.microsoft.com/repos/azure-cli/
development_azure_cli_gpg_url: https://packages.microsoft.com/keys/microsoft.asc
development_azure_cli_gpg_fingerprints:
  - BC528686B50D79E339D3721CEB3E94ADBE1229CF
development_azure_cli_keyring: /etc/apt/keyrings/microsoft.asc

development_apt_arch_map:
  x86_64: amd64
  aarch64: arm64
