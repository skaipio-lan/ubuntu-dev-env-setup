---
- name: "Check whether the tool is installed: {{ tool_name }}"
  ansible.builtin.stat:
    path: "{{ ai_tools_bin_dir }}/{{ tool_command }}"
  register: ai_tools_installed

- name: "Note that the tool would be installed: {{ tool_name }}"
  ansible.builtin.debug:
    msg: "{{ tool_name }} would be installed with {{ tool_installer_url }}."
  when: not ai_tools_installed.stat.exists and ansible_check_mode

- name: "Install with the official installer: {{ tool_name }}"
  when: not ai_tools_installed.stat.exists and not ansible_check_mode
  block:
    - name: "Create a temporary installer directory: {{ tool_name }}"
      ansible.builtin.tempfile:
        state: directory
        suffix: "{{ tool_command }}"
      register: ai_tools_tmp

    - name: "Download the installer: {{ tool_name }}"
      ansible.builtin.get_url:
        url: "{{ tool_installer_url }}"
        dest: "{{ ai_tools_tmp.path }}/install.sh"
        mode: "0644"

    # ~/.local/bin is put first on PATH so the installers never edit shell
    # startup files (~/.zshrc is managed by the shell role).
    - name: "Run the installer: {{ tool_name }}"
      ansible.builtin.command:
        argv: ["{{ tool_installer_shell }}", "{{ ai_tools_tmp.path }}/install.sh"]
        chdir: "{{ ai_tools_tmp.path }}"
        creates: "{{ ai_tools_bin_dir }}/{{ tool_command }}"
      environment: "{{ tool_environment | combine({'PATH': ai_tools_bin_dir ~ ':' ~ ansible_facts.env.PATH}) }}"

  always:
    - name: "Remove the installer: {{ tool_name }}"
      ansible.builtin.file:
        path: "{{ ai_tools_tmp.path }}"
        state: absent
      when: ai_tools_tmp.path is defined
