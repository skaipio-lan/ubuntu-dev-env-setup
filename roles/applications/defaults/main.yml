---
# Per-application switches. Each application has its own tag as well.
applications_zed: true
applications_ferdium: true
applications_ghostty: true

# Zed is installed the same way as the official install script
# (https://zed.dev/install.sh): the stable tarball is unpacked into
# ~/.local/zed.app, then Zed keeps itself up to date. Ansible only installs
# it when missing and keeps the launcher and desktop entry in place.
applications_zed_install_dir: "{{ ansible_facts.user_dir }}/.local/zed.app"
applications_zed_download_url: "https://zed.dev/api/releases/stable/latest/zed-linux-{{ ansible_facts.architecture }}.tar.gz"
applications_zed_settings: "{{ ansible_facts.user_dir }}/.config/zed/settings.json"
# Extension IDs from https://zed.dev/extensions, written to
# auto_install_extensions in settings.json. Zed installs them when it next
# starts. Removing an ID here does not uninstall the extension.
applications_zed_extensions:
  - git-firefly    # Git Firefly
  - html           # HTML
  - toml           # TOML
  - dockerfile     # Dockerfile
  - sql            # SQL
  - tsgo           # TypeScript Language Server (TypeScript 7 native)
  - terraform      # Terraform
  - biome          # Biome
  - ansible        # Ansible
  - github-actions # GitHub Actions
  - depsy-lsp      # Depsy
  - catppuccin     # Catppuccin themes
  - catppuccin-icons # Catppuccin icon themes

# Other top-level Zed settings this role manages. Each key must not also be
# set by hand in settings.json; the run stops if it is.
applications_zed_settings_managed:
  icon_theme: Catppuccin Frappé
  theme:
    mode: system
    light: Catppuccin Latte
    dark: Catppuccin Frappé

applications_zed_block_settings: >-
  {{ ({'auto_install_extensions': dict(applications_zed_extensions | product([true]))}
      if applications_zed_extensions | length > 0 else {})
     | combine(applications_zed_settings_managed) }}

# Ferdium is installed from the official .deb on GitHub, pinned to a version
# and verified by SHA-256. It is not updated automatically: to update, run
# scripts/ferdium-latest-release.sh and paste its output here.
applications_ferdium_version: "7.2.3"
applications_ferdium_sha256:
  amd64: f8a3f5d3b6bc4e6af6a91f291fe807b97a84aa20b91313c65e860ea95d54adba
  arm64: e979ee4aa1ce2710144531967e2e10501bf889cb4b9a3789028cab3e0fa8f818
applications_ferdium_arch_map:
  x86_64: amd64
  aarch64: arm64
applications_ferdium_arch: "{{ applications_ferdium_arch_map[ansible_facts.architecture] }}"
applications_ferdium_release_base: https://github.com/ferdium/ferdium-app/releases/download
applications_ferdium_deb_url: >-
  {{ applications_ferdium_release_base ~ '/v' ~ applications_ferdium_version
     ~ '/Ferdium-linux-' ~ applications_ferdium_version ~ '-' ~ applications_ferdium_arch ~ '.deb' }}

# Ghostty from the Ubuntu archive (universe), updated by APT. When
# applications_ghostty_default is true it becomes the default terminal for
# GNOME (through xdg-terminal-exec) and the x-terminal-emulator alternative.
applications_ghostty_default: true
applications_ghostty_desktop_id: com.mitchellh.ghostty.desktop
