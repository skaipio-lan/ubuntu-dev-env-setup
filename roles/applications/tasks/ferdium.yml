---
- name: Gather installed package facts
  ansible.builtin.package_facts:

# Install when missing or older than applications_ferdium_version. A newer installed
# version is left alone rather than downgraded.
- name: Decide whether Ferdium needs installing
  ansible.builtin.set_fact:
    applications_ferdium_needs_install: >-
      {{ 'ferdium' not in ansible_facts.packages
         or ansible_facts.packages['ferdium'][0].version is version(applications_ferdium_version, '<') }}

# apt cannot install from a .deb that check mode never downloaded.
- name: Note that Ferdium would be installed
  ansible.builtin.debug:
    msg: Ferdium {{ applications_ferdium_version }} would be downloaded, verified, and installed.
  when: applications_ferdium_needs_install | bool and ansible_check_mode

- name: Download, verify, and install Ferdium
  when: applications_ferdium_needs_install | bool and not ansible_check_mode
  block:
    - name: Create a temporary download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: ferdium
      register: applications_ferdium_tmp

    - name: Download the Ferdium package and verify its checksum
      ansible.builtin.get_url:
        url: "{{ applications_ferdium_deb_url }}"
        dest: "{{ applications_ferdium_tmp.path }}/ferdium.deb"
        checksum: "sha256:{{ applications_ferdium_sha256[applications_ferdium_arch] }}"
        mode: "0644"

    - name: Ensure Ferdium is installed
      become: true
      ansible.builtin.apt:
        deb: "{{ applications_ferdium_tmp.path }}/ferdium.deb"
        fail_on_autoremove: true

  always:
    - name: Remove the temporary download directory
      ansible.builtin.file:
        path: "{{ applications_ferdium_tmp.path }}"
        state: absent
      when: applications_ferdium_tmp.path is defined
