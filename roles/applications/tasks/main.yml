---
- name: Install Zed
  ansible.builtin.import_tasks: zed.yml
  when: applications_zed | bool
  tags: [zed]

- name: Install Ferdium
  ansible.builtin.import_tasks: ferdium.yml
  when: applications_ferdium | bool
  tags: [ferdium]

- name: Install Ghostty
  ansible.builtin.import_tasks: ghostty.yml
  when: applications_ghostty | bool
  tags: [ghostty]
