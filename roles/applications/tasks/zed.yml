---
# No mode on purpose: create missing directories without changing the
# permissions of existing ones (~/.local/share/applications is often 0700).
- name: Ensure Zed directories exist  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ ansible_facts.user_dir }}/.local/bin"
    - "{{ ansible_facts.user_dir }}/.local/share/applications"
    - "{{ ansible_facts.user_dir }}/.config/zed"

# Skipped when Zed is already installed; Zed updates itself afterwards.
- name: Ensure Zed is installed
  ansible.builtin.unarchive:
    src: "{{ applications_zed_download_url }}"
    dest: "{{ applications_zed_install_dir | dirname }}"
    remote_src: true
    creates: "{{ applications_zed_install_dir }}/bin/zed"

- name: Ensure the zed command is on PATH
  ansible.builtin.file:
    src: "{{ applications_zed_install_dir }}/bin/zed"
    dest: "{{ ansible_facts.user_dir }}/.local/bin/zed"
    state: link
    # In check mode on a first run the target does not exist yet.
    force: "{{ ansible_check_mode }}"

- name: Read the bundled Zed desktop entry
  ansible.builtin.slurp:
    src: "{{ applications_zed_install_dir }}/share/applications/dev.zed.Zed.desktop"
  register: applications_zed_desktop
  # In check mode on a first run Zed is not unpacked yet.
  failed_when: false

# Same substitutions as install.sh, so the app launcher points at this copy.
# Rerunning also picks up desktop entry changes from Zed's self-updates.
- name: Ensure the Zed desktop entry is installed
  ansible.builtin.copy:
    content: >-
      {{ applications_zed_desktop.content | b64decode
         | regex_replace('Icon=zed', 'Icon=' ~ applications_zed_install_dir ~ '/share/icons/hicolor/512x512/apps/zed.png')
         | regex_replace('Exec=zed', 'Exec=' ~ applications_zed_install_dir ~ '/bin/zed') }}
    dest: "{{ ansible_facts.user_dir }}/.local/share/applications/dev.zed.Zed.desktop"
    mode: "0755"  # Matches install.sh, which copies the bundled file's mode.
  when: applications_zed_desktop.content is defined

# Zed settings managed by this role: auto_install_extensions (Zed installs
# the listed extensions when it next starts) plus applications_zed_settings_managed.
# settings.json allows comments, so instead of rewriting it the role keeps
# one marked block right after the opening brace.
- name: Configure Zed settings
  when: applications_zed_block_settings | length > 0
  tags: [zed-settings, zed-extensions]
  block:
    - name: Ensure Zed settings exist
      ansible.builtin.copy:
        content: "{\n}\n"
        dest: "{{ applications_zed_settings }}"
        mode: "0600"
        force: false
      register: applications_zed_settings_created

    # Prints only key names, never values, which may hold credentials.
    - name: Find managed Zed settings that are also set outside the block
      ansible.builtin.command:
        argv: "{{ ['python3', '-I', '-c', applications_zed_settings_check, applications_zed_settings] + (applications_zed_block_settings.keys() | list) }}"
      vars:
        applications_zed_settings_check: |
          import json, re, sys
          try:
              text = open(sys.argv[1]).read()
          except FileNotFoundError:
              text = "{}"
          text = re.sub(r"// BEGIN ubuntu-dev-env-setup.*?// END ubuntu-dev-env-setup[^\n]*", "", text, flags=re.S)
          text = re.sub(r"(?m)^\s*//.*$", "", text)
          text = re.sub(r",(\s*[}\]])", r"\1", text)
          try:
              keys = json.loads(text).keys()
          except ValueError:
              sys.exit("could not parse the settings file")
          print(json.dumps(sorted(set(keys) & set(sys.argv[2:]))))
      register: applications_zed_settings_duplicates
      changed_when: false
      check_mode: false

    - name: Stop if managed Zed settings are also set by hand
      ansible.builtin.assert:
        that: applications_zed_settings_duplicates.stdout | from_json | length == 0
        fail_msg: >-
          {{ applications_zed_settings }} sets
          {{ applications_zed_settings_duplicates.stdout | from_json | join(', ') }}
          outside the block this role manages. Delete those settings from the
          file (the role sets them from applications_zed_extensions and
          applications_zed_settings_managed), then rerun.
        quiet: true

    # Earlier versions of this role used a block that held only extensions.
    - name: Ensure the old extensions-only block is removed
      ansible.builtin.blockinfile:
        path: "{{ applications_zed_settings }}"
        marker: "  // {mark} ubuntu-dev-env-setup: Zed extensions"
        state: absent
      when: not (ansible_check_mode and applications_zed_settings_created is changed)

    # In check mode on a first run the settings file is not created yet.
    - name: Ensure managed Zed settings are in settings.json
      ansible.builtin.blockinfile:
        path: "{{ applications_zed_settings }}"
        marker: "  // {mark} ubuntu-dev-env-setup: Zed settings"
        # Only the top-level brace starts a line; nested ones are indented.
        insertafter: '^\{\s*$'
        block: |
          {% for key, value in applications_zed_block_settings.items() %}
            "{{ key }}": {{ value | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) | indent(2) }},
          {% endfor %}
      when: not (ansible_check_mode and applications_zed_settings_created is changed)
