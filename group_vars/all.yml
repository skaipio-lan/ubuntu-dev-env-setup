---
# Profile switches. Override per machine in host_vars/<host>.yml or per run
# with -e install_<role>=false. A missing switch disables its role.
install_base: true
install_shell: true
install_git: true
install_development: true
install_docker: true
install_applications: true
install_ai_tools: true

# Ubuntu releases this setup has been verified against.
supported_ubuntu_versions:
  - "26.04"
