[defaults]
inventory = inventory.ini
interpreter_python = /usr/bin/python3
callback_result_format = yaml
retry_files_enabled = false
# Use ansible_facts[...] only; top-level ansible_* fact variables are removed
# in ansible-core 2.24. Disabling them now turns mistakes into errors.
inject_facts_as_vars = false

[privilege_escalation]
# Ubuntu 26.04 defaults to sudo-rs, whose password prompt Ansible cannot
# detect (become times out). Use the classic sudo from the "sudo" package.
become_exe = /usr/bin/sudo.ws
